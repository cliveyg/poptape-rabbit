services:
  pop:
    hostname: rabbit
    restart: always
    image: rabbitmq:management
    env_file: .env
    volumes:
      - poptape_rabbit_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    networks:
      - poptape
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
networks:
  poptape:
    external: true
volumes:
  poptape_rabbit_data:
    name: poptape_rabbit_data